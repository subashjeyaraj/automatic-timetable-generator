<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Timetable (Day Order) - TimeTable Studio</title>
  <meta name="description" content="Generate 6-day order weekly timetables with period slot allocation, lab/theory classification, and image export.">
  <link rel="stylesheet" href="style.css">
  <!-- html2canvas for crisp PNG download -->
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>

  <!-- Ambient Glow Effects -->
  <div class="bg-ambient">
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
  </div>

  <!-- Shared App Header -->
  <header class="app-header"></header>

  <!-- Main Content Wrapper -->
  <main class="main-wrapper">

    <!-- Page Header -->
    <div class="page-header">
      <div class="page-title-group">
        <h1>📅 Weekly Timetable (Day Order System)</h1>
        <p>Dynamic 6-period daily distribution with balanced subject hours & lab blocks</p>
      </div>

      <div class="header-controls">
        <button onclick="downloadTimetable()" class="btn btn-secondary">
          📥 Download Image
        </button>
        <button onclick="window.print()" class="btn btn-secondary">
          🖨️ Print
        </button>
      </div>
    </div>

    <!-- Generator Control Card -->
    <div class="card" style="margin-bottom: 2rem;">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="dept">Select Department</label>
          <select id="dept" onchange="autoLoadExisting()">
            <option value="CS" selected>Computer Science (CS)</option>
            <option value="BCA">Computer Applications (BCA)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="year">Select Academic Year</label>
          <select id="year" onchange="autoLoadExisting()">
            <option value="1" selected>1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
          </select>
        </div>

        <div class="form-group">
          <button onclick="generateWeekly()" class="btn btn-primary" style="height: 44px;">
            ⚡ Generate Timetable
          </button>
        </div>

        <div class="form-group">
          <button onclick="TimeTableApp.resetSampleData(); generateWeekly();" class="btn btn-secondary" style="height: 44px;">
            🔄 Refresh Pool
          </button>
        </div>
      </div>
    </div>

    <!-- Timetable Render Container -->
    <div id="tableContainer">
      <!-- Injected by JavaScript -->
    </div>

  </main>

  <!-- App Footer -->
  <footer class="app-footer">
    <p>TimeTable Studio • Weekly Day Order Timetable Module</p>
  </footer>

  <script src="app.js"></script>
  <script>
    // Authentication & Header
    TimeTableApp.checkAuth(true);
    TimeTableApp.renderNavbar('weekly');

    function generateWeekly() {
      const dept = document.getElementById("dept").value;
      const year = document.getElementById("year").value;

      if (!dept || !year) {
        TimeTableApp.showToast("Please choose department and year", "error");
        return;
      }

      const teachers = TimeTableApp.getTeachers(dept, year);
      if (teachers.length === 0) {
        TimeTableApp.showToast(`No faculty found for ${dept} Year ${year}. Adding defaults...`, "info");
        TimeTableApp.initDataStore(true);
      }

      const freshTeachers = TimeTableApp.getTeachers(dept, year);
      const timetable = TimeTableApp.createTimetableForClass(dept, year, freshTeachers);

      // Save to localStorage
      localStorage.setItem(`tt_${dept}_${year}`, JSON.stringify(timetable));

      // Also update master timetable so absent.html can read it immediately
      let master = {};
      try {
        master = JSON.parse(localStorage.getItem("timetable")) || {};
      } catch (e) {
        master = {};
      }

      TimeTableApp.DAY_ORDERS.forEach(day => {
        master[`${dept}-${year}-${day}`] = timetable[day];
      });
      localStorage.setItem("timetable", JSON.stringify(master));

      renderWeeklyTable(dept, year, timetable);
      TimeTableApp.showToast(`Timetable generated for ${dept} Year ${year}!`, "success");
    }

    function renderWeeklyTable(dept, year, timetable) {
      const container = document.getElementById("tableContainer");

      let html = `
        <div id="downloadArea" class="export-canvas">
          <div class="export-canvas-header">
            <div>
              <h2>🏛️ ${dept === 'CS' ? 'Computer Science' : 'Computer Applications'} — Year ${year}</h2>
              <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.2rem;">
                Official Academic Schedule • 6 Day Orders • 6 Periods Daily
              </p>
            </div>
            <span>Day Order System</span>
          </div>

          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th style="width: 140px; text-align: left; padding-left: 1.25rem;">Day Order</th>
                  <th>P1 <br><small style="color: var(--text-dim); font-weight: normal;">09:30 - 10:30</small></th>
                  <th>P2 <br><small style="color: var(--text-dim); font-weight: normal;">10:30 - 11:30</small></th>
                  <th>P3 <br><small style="color: var(--text-dim); font-weight: normal;">11:45 - 12:45</small></th>
                  <th>P4 <br><small style="color: var(--text-dim); font-weight: normal;">01:30 - 02:30</small></th>
                  <th>P5 <br><small style="color: var(--text-dim); font-weight: normal;">02:30 - 03:30</small></th>
                  <th>P6 <br><small style="color: var(--text-dim); font-weight: normal;">03:30 - 04:30</small></th>
                </tr>
              </thead>
              <tbody>
      `;

      TimeTableApp.DAY_ORDERS.forEach(day => {
        html += `
          <tr>
            <td style="text-align: left; padding-left: 1.25rem; font-weight: 700; color: #fff; background: rgba(30, 41, 59, 0.4);">
              ${day}
            </td>
        `;

        const periods = timetable[day] || [];
        periods.forEach(p => {
          if (!p || p.subject === "FREE") {
            html += `
              <td class="cell-free">
                <div class="period-cell">
                  <div class="period-sub" style="color: var(--text-dim);">FREE</div>
                  <span class="badge badge-free">Free Slot</span>
                </div>
              </td>
            `;
          } else {
            const badgeClass = p.type === 'Lab' ? 'badge-lab' : 'badge-theory';
            html += `
              <td>
                <div class="period-cell">
                  <div class="period-sub">${p.subject}</div>
                  <div class="period-teacher">${p.teacherName || p.teacher}</div>
                  <span class="badge ${badgeClass}">${p.type}</span>
                </div>
              </td>
            `;
          }
        });

        html += `</tr>`;
      });

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function autoLoadExisting() {
      const dept = document.getElementById("dept").value;
      const year = document.getElementById("year").value;
      const saved = localStorage.getItem(`tt_${dept}_${year}`);

      if (saved) {
        try {
          const tt = JSON.parse(saved);
          renderWeeklyTable(dept, year, tt);
          return;
        } catch (e) {}
      }
      generateWeekly();
    }

    function downloadTimetable() {
      const dept = document.getElementById("dept").value;
      const year = document.getElementById("year").value;
      TimeTableApp.downloadCanvasImage("downloadArea", `${dept}_Year${year}_Timetable.png`);
    }

    window.addEventListener("DOMContentLoaded", autoLoadExisting);
  </script>
</body>
</html>
